<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bağlantı yok</title>
<style>
:root{--bg:#F2EFE8;--ink:#1C2430;--muted:#566070;--btn:#1C2430;--on:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#14191F;--ink:#EEF0F2;--muted:#A5AEB9;--btn:#EEF0F2;--on:#14191F}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
h1{font-family:Georgia,serif;font-size:26px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px;line-height:1.5}
a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;border-radius:14px;background:var(--btn);color:var(--on);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div>
<h1>İnternet bağlantısı yok</h1>
<p>Ders programı ve yoklamalar internetten yüklenir.<br>Bağlantınızı kontrol edip tekrar deneyin.</p>
<a href="__APP_URL__">Tekrar dene</a>
</div>
</body>
</html>
