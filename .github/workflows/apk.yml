name: APK oluştur

on:
  push:
    branches: [main]
    paths: ['capacitor.config.json', 'package.json', 'www/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Uygulama adresini ayarla
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "APP_URL=https://${OWNER}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_ENV

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini hazırla
        run: |
          npm run set-url
          npx cap add android
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tiyatro-akademisi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tiyatro-akademisi-apk
          path: tiyatro-akademisi.apk

      - name: İndirme sayfasına koy (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Tiyatro Akademisi sürüm ${{ github.run_number }}
          body: Android telefona indirip kurun. Program ve tasarım güncellemeleri internetten otomatik gelir; bu dosyayı yeniden kurmanız gerekmez.
          files: tiyatro-akademisi.apk
          make_latest: true
