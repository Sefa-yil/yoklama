<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C63">
<title>Tiyatro Akademisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EFE8; --card:#FFFFFF; --ink:#1C2430; --muted:#566070; --line:#E1DBCD; --chip:#E7E2D6;
  --accent:#0F5C63; --on-accent:#FFFFFF; --accent-soft:#DCE9E7; --accent-ink:#0A4146;
  --warn-bg:#F7DCCB; --warn-ink:#8A3A0C; --late-bg:#F6E7C1; --late-ink:#6B4E00;
  --dark:#1C2430; --on-dark:#FFFFFF; --overlay:rgba(20,25,31,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191F; --card:#1D242C; --ink:#EEF0F2; --muted:#A5AEB9; --line:#2F3843; --chip:#27303A;
    --accent:#7FD0C3; --on-accent:#0A2E31; --accent-soft:#1C3A3C; --accent-ink:#BFEDE5;
    --warn-bg:#4A2A18; --warn-ink:#F6BE9A; --late-bg:#463A12; --late-ink:#F2D98A;
    --dark:#EEF0F2; --on-dark:#14191F; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14191F; --card:#1D242C; --ink:#EEF0F2; --muted:#A5AEB9; --line:#2F3843; --chip:#27303A;
  --accent:#7FD0C3; --on-accent:#0A2E31; --accent-soft:#1C3A3C; --accent-ink:#BFEDE5;
  --warn-bg:#4A2A18; --warn-ink:#F6BE9A; --late-bg:#463A12; --late-ink:#F2D98A;
  --dark:#EEF0F2; --on-dark:#14191F; --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:20px 20px 120px}
h1,h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}
h2{font-size:19px}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.btnlike{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer}
.avatar{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:600}
.avatar.lg{width:60px;height:60px;font-size:20px}
.name{font-weight:600;font-size:16px}
.small{font-size:13px;color:var(--muted)}
.live{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.dot.off{background:transparent;border:1.5px solid var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--chip);border-radius:14px}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--warn-ink);border-color:var(--warn-ink);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.muted{background:var(--chip);color:var(--muted)}
.now{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.now .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.now .k{font-size:12px;opacity:.8}
.now .v{font-size:14px;font-weight:500}
.lesson{display:flex;gap:12px}
.lesson .t{width:50px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--accent);line-height:1.35}
.empty{padding:28px 16px;border:1.5px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-weight:600}
.att{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.tri{display:grid;grid-template-columns:repeat(3,48px);gap:4px}
.tri button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--muted)}
.tri button[aria-pressed="true"].var{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.tri button[aria-pressed="true"].gec{background:var(--late-bg);color:var(--late-ink);border-color:var(--late-ink)}
.tri button[aria-pressed="true"].yok{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-ink)}
.notice{padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13px;color:var(--muted)}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 8px 10px}
nav.tabs button{border:0;background:transparent;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.sheet-wrap{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--on-dark);padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90%}
.ico{display:inline-flex}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app"><main id="view" aria-live="polite"></main></div>
<nav class="tabs" aria-label="Ana menü"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeFirestore, getFirestore, persistentLocalCache, collection, doc, onSnapshot, setDoc, addDoc, deleteDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

var ICONS={
  simdi:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>',
  program:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  yoklama:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  yonetim:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  hesap:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};
var GUN=['','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
var GUNK=['','Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
var PUBLIC=['binalar','bolumler','hocalar','dersler'];

var S={tab:'simdi',filter:'all',hocaId:null,prog:{bolum:null,sinif:1,gun:null},yok:{dersId:null,tarih:null},adminSec:'dersler',adminBolum:''};
var D={binalar:{},bolumler:{},hocalar:{},dersler:{},ogrenciler:{},loaded:{},error:null};
var U={user:null,rol:'',rolUnsub:null,ogrUnsub:null};
var canAdmin=false,canAtt=false;
var att={key:null,unsub:null,saved:{},draft:{},dirty:false,savedAt:null};
var fs=null,auth=null;

/* ---------- Firebase adapter ---------- */
var fdb={
  col:function(c,next,err){return onSnapshot(collection(fs,c),function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});next(m)},err)},
  doc:function(p,next,err){return onSnapshot(doc(fs,p),function(s){next(s.exists()?s.data():null)},err)},
  set:function(p,o){return setDoc(doc(fs,p),o)},
  add:function(c,o){return addDoc(collection(fs,c),o)},
  del:function(p){return deleteDoc(doc(fs,p))},
  newId:function(c){return doc(collection(fs,c)).id}
};

/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='checked'||k==='disabled'||k==='selected')el[k]=!!v;
    else el.setAttribute(k,v===true?'':v);}}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(el,x)});return;}
  el.append(c instanceof Node?c:document.createTextNode(String(c)));}
function icon(n){var s=h('span',{class:'ico','aria-hidden':'true'});s.innerHTML=ICONS[n];return s;}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromIso(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function gunOf(d){var g=d.getDay();return g===0?7:g}
function mins(t){var p=String(t||'0:0').split(':').map(Number);return p[0]*60+(p[1]||0)}
function initials(n){var w=String(n||'').replace(/(Prof\.|Doç\.|Dr\.|Öğr\.|Gör\.)/g,'').trim().split(/\s+/);return ((w[0]||'')[0]||'')+((w[w.length-1]||'')[0]||'')}
function list(c){return Object.keys(D[c]).map(function(id){var o=Object.assign({},D[c][id]);o.id=id;return o;})}
function byName(a,b){return String(a.ad||'').localeCompare(String(b.ad||''),'tr')}
function byTime(a,b){return (a.gun-b.gun)||(mins(a.bas)-mins(b.bas))}
function place(d){var b=D.binalar[d.binaId];if(!b)return 'Yer belirtilmedi';return [b.kampus,b.ad,d.derslik].filter(Boolean).join(', ')}
function hocaAd(id){return D.hocalar[id]?D.hocalar[id].ad:'Hoca atanmadı'}
function bolumAd(d){var b=D.bolumler[d.bolumId];return (b?b.ad:'Bölüm yok')+', '+d.sinif+'. sınıf'}
function ogrListe(bolumId,sinif){var o=D.ogrenciler[bolumId];return ((o&&o.siniflar)||{})[String(sinif)]||[]}
function toast(msg){var t=document.getElementById('toast');t.innerHTML='';var el=h('div',{class:'toast',role:'status'},msg);t.append(el);setTimeout(function(){if(el.parentNode)el.remove()},2800);}
function errMsg(e){var c=(e&&e.code)||'';
  if(c==='permission-denied')return 'Bu işlem için yetkiniz yok.';
  if(c==='unavailable')return 'İnternet bağlantısı yok; bağlantı gelince tekrar deneyin.';
  if(c==='resource-exhausted')return 'Çok hızlı işlem yapıldı, birkaç saniye sonra deneyin.';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'E-posta veya şifre hatalı.';
  if(c==='auth/too-many-requests')return 'Çok fazla deneme yapıldı, biraz sonra tekrar deneyin.';
  if(c==='auth/network-request-failed')return 'İnternet bağlantısı yok.';
  if(c==='auth/invalid-email')return 'E-posta adresi geçerli değil.';
  return 'İşlem tamamlanamadı, tekrar deneyin.';}
function selectEl(id,opts,cur,onchange){var s=h('select',{id:id,onchange:onchange});fillSelect(s,opts,cur);return s;}
function fillSelect(s,opts,cur){s.innerHTML='';opts.forEach(function(o){s.append(h('option',{value:o[0],selected:String(o[0])===String(cur)},o[1]))});}
function field(label,id,control){return h('div',{class:'field'},h('label',{for:id},label),control);}
function lines(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)}

/* ---------- schedule logic ---------- */
function nowInfo(){var n=new Date();return {g:gunOf(n),m:n.getHours()*60+n.getMinutes()}}
function currentOf(hid){var n=nowInfo();return list('dersler').filter(function(d){return d.hocaId===hid&&d.gun===n.g&&mins(d.bas)<=n.m&&n.m<mins(d.bit)})[0]}
function nextOf(hid){var n=nowInfo();var ds=list('dersler').filter(function(d){return d.hocaId===hid});
  for(var i=0;i<7;i++){var g=((n.g-1+i)%7)+1;var c=ds.filter(function(d){return d.gun===g&&(i>0||mins(d.bas)>n.m)}).sort(byTime);if(c.length)return {d:c[0],today:i===0};}
  return null;}
function overlap(a,b){return a.gun===b.gun&&mins(a.bas)<mins(b.bit)&&mins(b.bas)<mins(a.bit)}
function conflicts(d,id){var out=[];list('dersler').forEach(function(o){if(o.id===id||!overlap(d,o))return;
  if(d.hocaId&&o.hocaId===d.hocaId)out.push(hocaAd(d.hocaId)+' aynı saatte '+o.ad+' dersinde.');
  if(d.binaId&&o.binaId===d.binaId&&o.derslik===d.derslik)out.push(place(d)+' aynı saatte '+o.ad+' için dolu.');
  if(o.bolumId===d.bolumId&&String(o.sinif)===String(d.sinif))out.push(bolumAd(d)+' aynı saatte '+o.ad+' dersinde.');});
  return out;}
function allConflictIds(){var ids={};list('dersler').forEach(function(d){if(conflicts(d,d.id).length)ids[d.id]=true});return ids;}
function dateForGun(g){var n=new Date();var diff=g-gunOf(n);if(diff>0)diff-=7;var d=new Date(n);d.setDate(n.getDate()+diff);return iso(d);}

/* ---------- render ---------- */
function ready(){return PUBLIC.every(function(c){return D.loaded[c]})}
function render(){
  renderTabs();
  var v=document.getElementById('view');v.innerHTML='';
  if(D.error){v.append(h('div',{class:'stack'},h('h1',null,'Tiyatro Akademisi'),h('div',{class:'notice warn'},D.error)));return;}
  if(S.tab==='hesap'){v.append(viewHesap());return;}
  if(!ready()){v.append(h('div',{class:'stack'},h('h1',null,'Tiyatro Akademisi'),h('p',{class:'sub'},'Program yükleniyor…')));return;}
  var f={simdi:viewSimdi,program:viewProgram,yoklama:viewYoklama,yonetim:viewYonetim}[S.tab]||viewSimdi;
  v.append(f());
}
function renderTabs(){
  var t=document.getElementById('tabs');t.innerHTML='';
  var tabs=[['simdi','Hocalar'],['program','Programlar']];
  if(canAtt)tabs.push(['yoklama','Yoklama']);
  if(canAdmin)tabs.push(['yonetim','Yönetim']);
  tabs.push(['hesap',U.user?'Hesabım':'Giriş']);
  tabs.forEach(function(x){t.append(h('button',{type:'button','aria-current':S.tab===x[0]?'page':null,onclick:function(){go(x[0])}},icon(x[0]),x[1]))});
}
function go(tab){if(S.tab==='yoklama'||tab==='yoklama')closeAtt();S.tab=tab;if(tab==='simdi')S.hocaId=null;if(tab==='yoklama')S.yok.dersId=null;render();window.scrollTo(0,0);}
function header(title,sub,right){return h('div',{class:'row between',style:'align-items:flex-end;margin-bottom:16px'},h('div',{class:'stack',style:'gap:4px'},sub?h('div',{class:'sub'},sub):null,h('h1',null,title)),right||null)}
function backBtn(label,fn){return h('button',{type:'button',class:'linkbtn',style:'margin:-8px 0 6px -6px',onclick:fn},icon('back'),label)}
function fmtNow(){return new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date())}
function emptyData(what){return h('div',{class:'empty'},canAdmin?what+' Yönetim sekmesinden ekleyebilirsiniz.':what+' Yönetici program girdiğinde burada görünecek.')}

/* Hocalar */
function viewSimdi(){
  if(S.hocaId&&D.hocalar[S.hocaId])return viewHoca(S.hocaId);
  var hs=list('hocalar').map(function(x){x.cur=currentOf(x.id);return x}).sort(function(a,b){return (!!b.cur-!!a.cur)||byName(a,b)});
  var derste=hs.filter(function(x){return x.cur}).length;

    actions(id,'hocalar',function(btn){var o={ad:ad.value.trim(),bolum:bl.value.trim()};if(!o.ad){toast('Hocanın adını yazın.');return;}done(btn,writeDoc('hocalar',id,o),'Hoca kaydedildi');},function(){return usedBy('hocaId',id,'Bu hocanın # dersi var; önce dersleri başka hocaya atayın.')})));}

function bolumForm(id){var x=id?D.bolumler[id]:{ad:'',fakulte:'',sinifSayisi:4};
  var ad=h('input',{id:'f-ad',value:x.ad||'',placeholder:'ör. Tiyatro'});
  var fk=h('input',{id:'f-fk',value:x.fakulte||'',placeholder:'ör. Güzel Sanatlar Fakültesi'});
  var og=Object.assign({},(id&&D.ogrenciler[id]&&D.ogrenciler[id].siniflar)||{});var areas={};
  var box=h('div',{class:'stack',style:'gap:14px'});
  function buildAreas(n){Object.keys(areas).forEach(function(k){og[k]=lines(areas[k].value)});areas={};box.innerHTML='';
    for(var i=1;i<=n;i++){var ta=h('textarea',{id:'f-o'+i,placeholder:'Her satıra bir öğrenci'});ta.value=(og[String(i)]||[]).join('\n');areas[String(i)]=ta;box.append(field(i+'. sınıf öğrencileri','f-o'+i,ta));}}
  var sc=selectEl('f-sc',[1,2,3,4,5,6].map(function(n){return [n,n+' sınıf']}),x.sinifSayisi||4,function(){buildAreas(Number(sc.value))});
  buildAreas(Number(x.sinifSayisi||4));
  openSheet(id?'Bölümü düzenle':'Yeni bölüm',h('div',{class:'stack',style:'gap:14px'},field('Bölüm adı','f-ad',ad),field('Fakülte','f-fk',fk),field('Sınıf sayısı','f-sc',sc),box,
    h('p',{class:'small',style:'margin:0'},'Öğrenci listeleri yalnızca hocalar ve yöneticiler tarafından görülür.'),
    actions(id,'bolumler',function(btn){var o={ad:ad.value.trim(),fakulte:fk.value.trim(),sinifSayisi:Number(sc.value)};
      if(!o.ad){toast('Bölüm adını yazın.');return;}
      var siniflar={};Object.keys(areas).forEach(function(k){siniflar[k]=lines(areas[k].value)});
      var bid=id||fdb.newId('bolumler');
      done(btn,fdb.set('bolumler/'+bid,o).then(function(){return fdb.set('ogrenciler/'+bid,{siniflar:siniflar})}),'Bölüm kaydedildi');},
      function(){return usedBy('bolumId',id,'Bu bölümün # dersi var; önce dersleri silin.')},function(){return fdb.del('ogrenciler/'+id)})));}

function dersForm(id){
  var bs=list('bolumler').sort(byName),bn=list('binalar').sort(byName),hs=list('hocalar').sort(byName);
  if(!bs.length||!bn.length){toast('Önce en az bir bölüm ve bir bina ekleyin.');return;}
  var x=id?Object.assign({},D.dersler[id]):{ad:'',kod:'',bolumId:S.adminBolum||bs[0].id,sinif:1,gun:1,bas:'09:00',bit:'10:50',hocaId:'',binaId:bn[0].id,derslik:''};
  var ad=h('input',{id:'f-ad',value:x.ad||'',placeholder:'ör. Oyunculuk I'});
  var kod=h('input',{id:'f-kod',value:x.kod||'',placeholder:'ör. TY101'});
  var sinif=h('select',{id:'f-sn'});var bol,bina;
  function fillSinif(){var b=D.bolumler[bol.value]||{};var n=Number(b.sinifSayisi)||4;var o=[];for(var i=1;i<=n;i++)o.push([i,i+'. sınıf']);fillSelect(sinif,o,x.sinif);}
  bol=selectEl('f-bl',bs.map(function(b){return [b.id,b.ad]}),x.bolumId,fillSinif);fillSinif();
  var gun=selectEl('f-gn',[1,2,3,4,5,6,7].map(function(g){return [g,GUN[g]]}),x.gun);
  var bas=h('input',{id:'f-bs',type:'time',value:x.bas});var bit=h('input',{id:'f-bt',type:'time',value:x.bit});
  var hoca=selectEl('f-hc',[['','Hoca atanmadı']].concat(hs.map(function(y){return [y.id,y.ad]})),x.hocaId||'');
  var dsl=h('select',{id:'f-ds'});
  function fillDs(){var b=D.binalar[bina.value]||{};fillSelect(dsl,(b.derslikler||[]).map(function(s){return [s,s]}),x.derslik);}
  bina=selectEl('f-bn',bn.map(function(b){return [b.id,b.ad+(b.kampus?' ('+b.kampus+')':'')]}),x.binaId,fillDs);fillDs();
  var warn=h('div',{class:'notice warn',style:'display:none'});var confirmed=false;
  openSheet(id?'Dersi düzenle':'Yeni ders',h('div',{class:'stack',style:'gap:14px'},
    h('div',{class:'grid2',style:'grid-template-columns:2fr 1fr'},field('Ders adı','f-ad',ad),field('Kod','f-kod',kod)),
    h('div',{class:'grid2'},field('Bölüm','f-bl',bol),field('Sınıf','f-sn',sinif)),
    field('Gün','f-gn',gun),h('div',{class:'grid2'},field('Başlangıç','f-bs',bas),field('Bitiş','f-bt',bit)),
    field('Hoca','f-hc',hoca),h('div',{class:'grid2'},field('Bina','f-bn',bina),field('Derslik / salon','f-ds',dsl)),warn,
    actions(id,'dersler',function(btn){
      var o={ad:ad.value.trim(),kod:kod.value.trim(),bolumId:bol.value,sinif:Number(sinif.value),gun:Number(gun.value),bas:bas.value,bit:bit.value,hocaId:hoca.value,binaId:bina.value,derslik:dsl.value};
      if(!o.ad){toast('Ders adını yazın.');return;}
      if(!o.bas||!o.bit||mins(o.bas)>=mins(o.bit)){toast('Bitiş saati başlangıçtan sonra olmalı.');return;}
      if(!o.derslik){toast('Seçilen binaya önce derslik ekleyin.');return;}
      var c=conflicts(o,id);
      if(c.length&&!confirmed){warn.style.display='block';warn.textContent='Çakışma: '+c.join(' ');confirmed=true;btn.textContent='Yine de kaydet';return;}
      done(btn,writeDoc('dersler',id,o),'Ders kaydedildi');})));
}

/* ---------- auth & data ---------- */
function setRole(rol){U.rol=rol||'';canAdmin=U.rol==='yonetici';canAtt=canAdmin||U.rol==='hoca';
  if(U.ogrUnsub){U.ogrUnsub();U.ogrUnsub=null;D.ogrenciler={};}
  if(canAtt)U.ogrUnsub=fdb.col('ogrenciler',function(m){D.ogrenciler=m;render()},function(){});
  if(!canAtt&&(S.tab==='yoklama'||S.tab==='yonetim'))S.tab='simdi';
  if(!canAdmin&&S.tab==='yonetim')S.tab='simdi';
  render();}

function boot(){
  if(!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).indexOf('BURAYA')===0){D.error='Kurulum tamamlanmadı: firebase-config.js dosyasına Firebase proje bilgilerini girin.';render();return;}
  var app=initializeApp(firebaseConfig);
  try{fs=initializeFirestore(app,{localCache:persistentLocalCache()});}catch(e){fs=getFirestore(app);}
  auth=getAuth(app);
  PUBLIC.forEach(function(c){fdb.col(c,function(m){D[c]=m;D.loaded[c]=true;render()},function(e){D.loaded[c]=true;toast(errMsg(e));render()})});
  onAuthStateChanged(auth,function(user){
    U.user=user;if(U.rolUnsub){U.rolUnsub();U.rolUnsub=null;}
    if(!user){setRole('');return;}
    U.rolUnsub=fdb.doc('roller/'+user.uid,function(data){setRole(data&&data.rol)},function(){setRole('')});
  });
}
render();
setInterval(function(){if(S.tab==='simdi'&&!document.getElementById('sheet').children.length)render()},30000);
boot();
</script>
